# Alembic yapılandırması — LocalDoc AI
#
# Migration komutları `backend/` dizininden çalıştırılır:
#   alembic upgrade head                     # şemayı en güncel hale getir
#   alembic revision --autogenerate -m "..." # model değişikliğinden migration üret
#   alembic downgrade -1                      # bir adım geri al
#
# Veritabanı URL'i alembic.ini içinde tutulmaz; env.py, uygulamanın kendi
# ayarlarından (app.config.settings -> .env) DATABASE_URL'i okur.

[alembic]
# Migration script dizini (backend/ köküne göre).
script_location = migrations

# `app` paketinin import edilebilmesi için backend/ dizinini sys.path'e ekle.
prepend_sys_path = .

# Versiyon dosyası adı: <rev>_<slug>.py
file_template = %%(rev)s_%%(slug)s

# URL bilinçli olarak boş; env.py settings.DATABASE_URL ile doldurur.
sqlalchemy.url =


# --- Logging ---------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
